# Feature Hypotheses Simulation

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "feature-hypotheses-simulation"
version = "1.0.0"
description = "Democratizing Financial Risk Management for Product Development"
readme = "README.md"
license = "MIT"
authors = [
    {name = "eifel42.dev", email = "contact@example.com"}
]
maintainers = [
    {name = "eifel42.dev", email = "contact@example.com"}
]
keywords = ["risk-management", "product-development", "monte-carlo", "simulation", "financial-modeling"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.14"
dependencies = [
    "numpy>=1.26.0",
    "numpy-financial>=1.0.0",
    "scipy>=1.11.0",
    "statsmodels>=0.14.0",
    "matplotlib>=3.8.0",
    "pydantic>=2.0.0",
    "plotly>=5.0.0",
    "pyyaml>=5.4.0",
    "pandas>=2.0.0",
    "jinja2>=3.1.0",
    "scikit-learn>=1.5.0",
]

[project.optional-dependencies]
notebooks = [
    "jupyter>=1.1.1",
    "jupyterlab>=4.5.7",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.0.0",
    "beautifulsoup4>=4.12.0",
    "black>=24.0.0",
    "flake8>=7.0.0",
    "ruff>=0.4.0",
    "isort>=5.13.0",
    "mypy>=1.8.0",
    "types-PyYAML>=6.0.12",
    "pre-commit>=3.6.0",
    "pdoc>=14.0.0",
]
docs = [
    "pillow>=10.1.0",
    # mkdocs dependencies removed as project uses docToolchain
]

[project.urls]
Homepage = "https://github.com/Eifel42/feature-hypotheses-simulation-public"
Documentation = "https://eifel42.github.io/feature-hypotheses-simulation"
Repository = "https://github.com/Eifel42/feature-hypotheses-simulation-public.git"
Issues = "https://github.com/Eifel42/feature-hypotheses-simulation-public/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.black]
line-length = 88
target-version = ['py314']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["fhs"]

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "RUF", "BLE", "PT", "SIM"]
ignore = [
    "E501",
    "UP009",
    "RUF001",
    "RUF002",
    "RUF003",
    "SIM108",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["PT011", "PT015", "PT018", "PT019", "PT006", "B017", "B011", "RUF043"]
"src/fhs/presentation/**/*.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = [
    "tests",
]
python_files = [
    "test_*.py",
    "*_test.py",
]
