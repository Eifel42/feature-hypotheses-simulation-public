scenario_id: advanced-features
name: Advanced Feature Portfolio (10 Features)
description: Larger portfolio to demonstrate solver divergence at scale
budget: 400000.0
discount_rate: 0.08
cost_inflation_max: 0.25
risk_model:
  # Risk 1 is configured per feature via likelihood_of_non_delivery.
  # --- Risk 2: Market Shock (portfolio-wide) ---
  # Probability that a market downturn occurs in any given simulation.
  # When triggered, all feature business values are multiplied by the market multiplier.
  risk_2_market_probability: 0.20
  risk_2_market_multiplier: 0.85

  # --- Risk 3: Global Crisis (portfolio-wide) ---
  # Probability of a severe event (pandemic, regulation, etc.).
  # When triggered, all feature business values are multiplied by the global multiplier.
  risk_3_global_probability: 0.05
  risk_3_global_multiplier: 0.60

  # --- Component Risk (per dependency cluster) ---
  # Probability that a shared platform/dependency fails.
  # Features in the same cluster share the same failure draw.
  # When triggered, affected business values are multiplied by the component multiplier.
  component_risk_multiplier: 0.70
  default_component_probability: 0.08
  component_risk_by_cluster:
    Customer Platform: 0.08
    Supply Operations Platform: 0.12
    Commercial Intelligence Platform: 0.10
    Cold Chain Operations: 0.15
    Sustainability Data Platform: 0.06
strategy:
  'F01: Mobile App Redesign':
    category: Customer Experience
    reason: Improve usability to reduce churn and lift app engagement
  'F02: Real-Time Inventory':
    category: Operational Excellence
    reason: Cut waste by synchronising stock levels across warehouses
  'F03: Loyalty Programme':
    category: Retention Engine
    reason: Increase repeat purchases through segmented reward mechanics
  'F04: Supplier Portal':
    category: Supplier Integration
    reason: Automate supplier onboarding and order management
  'F05: AI Demand Forecast':
    category: Predictive Intelligence
    reason: Predict seasonal demand to optimise purchasing decisions
  'F06: Multi-Language Support':
    category: Market Expansion
    reason: Expand into French and Italian speaking regions
  'F07: Cold Chain Monitoring':
    category: Quality Assurance
    reason: Reduce spoilage with proactive IoT temperature monitoring
  'F08: Customer Self-Service':
    category: Service Automation
    reason: Reduce support workload and improve customer satisfaction
  'F09: Dynamic Pricing':
    category: Margin Optimization
    reason: Maximise margin on perishable goods near expiry
  'F10: Carbon Footprint Label':
    category: Sustainability Positioning
    reason: Strengthen premium positioning for sustainability-conscious buyers
features:
- name: 'F01: Mobile App Redesign'
  expected_users: 60000
  conversion_rate: 0.18
  uncertainty: 0.4
  business_value_per_conversion: 35.0
  development_cost: 120000.0
  installment_years: 2
  annual_operating_cost: 18000.0   # app store, CDN, push notifications
  annual_growth_rate: 0.2
  likelihood_of_non_delivery: 0.15
  dependency_cluster: Customer Platform
  planned_release: R1
  acceptance_model: binomial
  key: F01
- name: 'F02: Real-Time Inventory'
  expected_users: 25000
