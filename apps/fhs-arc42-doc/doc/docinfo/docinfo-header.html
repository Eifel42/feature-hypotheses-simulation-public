<!-- Meta tags for better mobile experience -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2156a5">

<!-- Fonts -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&family=Noto+Serif:wght@400;700&display=swap">

<!-- Highlight.js for code highlighting (light + dark themes) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/github.min.css" media="(prefers-color-scheme: light)">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/github-dark.min.css" media="(prefers-color-scheme: dark)">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', (event) => {
    document.querySelectorAll('pre code').forEach((block) => {
      hljs.highlightBlock(block);
    });
  });
</script>

<!-- Font Awesome for icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    corePlugins: {
      preflight: false, // Disable Tailwind's base styles to prevent conflicts
    },
    theme: {
      extend: {
        colors: {
          primary: 'var(--primary-color)',
          secondary: 'var(--secondary-color)',
          background: 'var(--background-color)',
          text: 'var(--text-color)',
          heading: 'var(--heading-color)',
          link: 'var(--link-color)',
          'link-hover': 'var(--link-hover-color)',
        },
      },
    },
  };
</script>

<!-- Mermaid for diagrams -->
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', (event) => {
    mermaid.initialize({
      startOnLoad: true,
      theme: 'default',
      flowchart: {
        useMaxWidth: true,
        htmlLabels: true,
        curve: 'linear'
      },
      c4: {
        diagramMarginX: 50,
        diagramMarginY: 10,
        c4ShapeMargin: 50,
        c4ShapeInRow: 4,
        c4BoundaryInRow: 2
      },
      er: {
        layoutDirection: 'TB',
        entityPadding: 15,
        useMaxWidth: true
      }
    });
  });
</script>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const path = window.location.pathname;
    const isIndex = path.endsWith('/index.html') || path === '/' || path === '';

    if (isIndex || document.querySelector('.back-to-index')) {
      return;
    }

    const pageTitle =
      document.querySelector('#content h1, #header h1')?.textContent?.trim() ||
      document.title.replace(/\s+-\s+.*$/, '').trim() ||
      'Current page';

    const link = document.createElement('a');
    link.href = 'index.html';
    link.className = 'back-to-index';
    link.setAttribute('rel', 'home');
    link.setAttribute('aria-label', `Back from ${pageTitle} to the documentation index`);
    link.setAttribute('title', 'Back to documentation index');
    link.innerHTML = `
      <span class="back-to-index__icon" aria-hidden="true">
        <i class="fa fa-arrow-left"></i>
      </span>
      <span class="back-to-index__copy">
        <span class="back-to-index__eyebrow">Documentation Hub</span>
        <span class="back-to-index__title">Return to index</span>
      </span>
    `;
    document.body.appendChild(link);
  });
</script>

<!-- Additional styles for modern appearance -->
<style>
  /* Smooth scrolling */
  html {
    scroll-behavior: smooth;
  }

  /* Improved focus styles for accessibility */
  a:focus, button:focus, input:focus, select:focus, textarea:focus {
    outline: 2px solid #2156a5;
    outline-offset: 2px;
  }

  /* Dark mode: all variables are defined in arc42-custom.css */
  /* Highlight.js theme is handled via media-query link tags above */

  /* Print QR code for mobile viewing */
  @media print {
    #qr-code {
      display: block;
      margin: 2em auto;
      text-align: center;
    }
  }

  /* Hide QR code on screen */
  #qr-code {
    display: none;
  }
</style>

<!-- Add QR code for printed documentation -->
<div id="qr-code">
  <p>Scan to view this documentation on your mobile device:</p>
  <img id="qr-code-img" alt="QR Code" width="150" height="150">
  <script>
    document.addEventListener('DOMContentLoaded', (event) => {
      const qrImg = document.getElementById('qr-code-img');
      if (qrImg) {
        qrImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(window.location.href)}`;
      }
    });
  </script>
</div>
