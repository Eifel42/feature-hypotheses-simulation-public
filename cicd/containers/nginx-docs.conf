server {
    listen       8085;
    server_name  localhost;

    root   /usr/share/nginx/html;

    # Root: redirect to the docs landing page (index with all three canvases).
    location = / {
        return 301 /html5/index.html;
    }

    # Serve regular doc assets; on 404 return the "not built yet" fallback.
    location / {
        try_files $uri $uri/ =404;
    }

    # "Not built yet" fallback — served from image, not the volume mount.
    error_page 404 @not_built;
    location @not_built {
        root  /usr/share/nginx/fallback;
        rewrite ^ /index.html break;
    }

    # Cache static assets
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        expires 1h;
        add_header Cache-Control "public, immutable";
    }

    # Gzip compression
    gzip on;
    gzip_types text/html text/css application/javascript text/xml image/svg+xml;
    gzip_min_length 256;
}
