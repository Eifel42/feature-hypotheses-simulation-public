server {
    listen       8085;
    server_name  localhost;

    # Serve docs/html5 at the root so URLs match GitHub Pages exactly
    # (https://.../architecture-communication-canvas.html, NOT /html5/...).
    # Required to reproduce GitHub-Pages-specific canvas rendering bugs
    # locally in Chrome/Firefox — Brave renders correctly either way.
    root   /usr/share/nginx/html/html5;

    # Backward-compat: old /html5/* bookmarks keep working.
    location ~ ^/html5/(.*)$ {
        return 301 /$1;
    }

    # HTML responses match GitHub Pages' cache headers (max-age=600).
    location ~ \.html$ {
        add_header Cache-Control "max-age=600" always;
        try_files $uri =404;
    }

    # Root path: serve index.html if present, otherwise "not built yet" fallback.
    location = / {
        try_files /index.html @not_built;
    }

    # Serve regular doc assets; on 404 return the "not built yet" fallback.
    location / {
        try_files $uri $uri/ =404;
    }

    # "Not built yet" fallback — served from image, not the volume mount.
    error_page 404 @not_built;
    location @not_built {
        root  /usr/share/nginx/fallback;
        rewrite ^ /index.html break;
    }

    # Cache static assets
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        expires 1h;
        add_header Cache-Control "public, immutable";
    }

    # Gzip compression
    gzip on;
    gzip_types text/html text/css application/javascript text/xml image/svg+xml;
    gzip_min_length 256;
}
